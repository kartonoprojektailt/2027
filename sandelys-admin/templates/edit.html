<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Naujas pasiūlymas - Sandėlis</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; padding: 30px; margin: 0; }
        .container { max-width: 850px; margin: auto; background: #1e1e1e; padding: 35px; border-radius: 10px; border: 1px solid #333; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #fff; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.95rem; color: #ccc; }
        input[type="text"], input[type="email"], select, textarea { width: 100%; padding: 10px 12px; background: #111; color: #fff; border: 1px solid #444; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        input:focus, select:focus, textarea:focus { border-color: #007bff; outline: none; }
        .row { display: flex; gap: 20px; }
        .col { flex: 1; }
        .file-box { background: #151515; border: 1px dashed #444; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        button { padding: 12px 30px; background: #28a745; color: #fff; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; font-size: 1rem; transition: background 0.2s; }
        button:hover { background: #218838; }
        a { color: #8ab4f8; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div style="margin-bottom: 20px;"><a href="/">← Atgal į sąrašą</a></div>
        <h2>Sukurti naują sandėlio pasiūlymą</h2>
        
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>Pavadinimas (Title):</label>
                <input type="text" name="title" required placeholder="pvz., Standartinė e-commerce dėžutė">
            </div>

            <div class="row">
                <div class="col form-group">
                    <label>Kategorija:</label>
                    <select name="category">
                        <option value="Stovai">Stovai</option>
                        <option value="Pakuotės">Pakuotės</option>
                        <option value="Medžiagos">Medžiagos</option>
                        <option value="Paslaugos">Paslaugos</option>
                    </select>
                </div>
                <div class="col form-group">
                    <label>Statusas:</label>
                    <select name="status">
                        <option value="aktyvus">Aktyvus</option>
                        <option value="parduota">Parduota</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col form-group">
                    <label>Kaina:</label>
                    <input type="text" name="price" required placeholder="0.45 € / vnt.">
                </div>
                <div class="col form-group">
                    <label>Likutis (kiekis):</label>
                    <input type="text" name="stock_qty" required placeholder="500">
                </div>
                <div class="col form-group">
                    <label>Matas / Vienetas:</label>
                    <select name="stock_unit">
                        <option value="vnt.">vnt.</option>
                        <option value="m²">m² (kv. metrai)</option>
                        <option value="l">l (litrai)</option>
                        <option value="kg">kg (kilogramai)</option>
                        <option value="rol.">rol. (rulonai)</option>
                    </select>
                </div>
            </div>

            <div class="file-box">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label>🖼️ Nuotraukos (galite pažymėti kelias iškart):</label>
                    <input type="file" name="images" multiple style="background: none; border: none; padding: 0;">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>📄 Techniniai dokumentai / brėžiniai PDF (galite pažymėti kelis failus):</label>
                    <input type="file" name="pdf_files" accept=".pdf" multiple style="background: none; border: none; padding: 0;">
                </div>
            </div>

            <div class="form-group">
                <label>Aprašymas:</label>
                <textarea name="description" rows="4" required placeholder="Trumpas prekės aprašymas..."></textarea>
            </div>

            <div class="form-group">
                <label>Techninės specifikacijos (Sąrašas punktais):</label>
                <textarea name="specs" rows="4" placeholder="- Medžiaga: ...&#10;- Matmenys: ..."></textarea>
            </div>

            <div class="form-group">
                <label>Paskirtis ir taikymo sritys:</label>
                <textarea name="application" rows="3" placeholder="Kur naudojama ši prekė..."></textarea>
            </div>

            <div class="form-group">
                <label>Skelbimo administratoriaus el. paštas (pranešimui):</label>
                <input type="email" name="manager_email" placeholder="manager@kartonoprojektai.lt">
            </div>

            <button type="submit">Publikuoti pasiūlymą</button>
        </form>
    </div>
</body>
</html>
