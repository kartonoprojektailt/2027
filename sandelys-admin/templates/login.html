<!DOCTYPE html>
<html lang="lt">
<head><meta charset="UTF-8"><title>Prisijungimas</title></head>
<body style="font-family: sans-serif; background: #111; color: #eee; display: flex; justify-content: center; align-items: center; height: 100vh;">
    <form method="POST" style="background: #222; padding: 30px; border-radius: 8px; border: 1px solid #444;">
        <h3>Sandėlio administravimas</h3>
        <input type="password" name="password" placeholder="Slaptažodis (admin)" style="padding: 10px; width: 100%; margin-bottom: 15px; background: #111; color: #fff; border: 1px solid #555;"><br>
        <button type="submit" style="padding: 10px 20px; background: #007bff; color: #fff; border: none; cursor: pointer; width: 100%;">Prisijungti</button>
    </form>
</body>
</html>
