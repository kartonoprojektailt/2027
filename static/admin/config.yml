backend:
  name: git-gateway
  branch: main

media_folder: "static/uploads"
public_folder: "/uploads"

collections:
  - name: "sandelyje"
    label: "Sandėlio Pasiūlymai"
    folder: "content/sandelyje"
    create: true
    slug: "{{fields.offer_code}}-{{slug}}"
    fields:
      - {label: "Pavadinimas (Title)", name: "title", widget: "string"}
      - {label: "Data", name: "date", widget: "datetime"}
      - {label: "Unikalus kodas (SKU)", name: "offer_code", widget: "string", hint: "np. kp20261015a"}
      - label: "Kategorija"
        name: "category"
        widget: "select"
        options: ["Stovai", "Pakuotės", "Medžiagos", "Paslaugos"]
      - label: "Statusas"
        name: "status"
        widget: "select"
        options: ["aktyvus", "parduota"]
      - {label: "Kaina", name: "price", widget: "string", hint: "np. 0.45 € / vnt."}
      - {label: "Likutis (kiekis ir matas)", name: "stock", widget: "string", hint: "np. 500 vnt."}
      - {label: "Aprašymas", name: "description", widget: "text"}
      - label: "Nuotraukos"
        name: "images"
        widget: "list"
        field: {label: "Nuotrauka", name: "image", widget: "image"}
      - label: "Techniniai dokumentai / PDF"
        name: "pdf_documents"
        widget: "list"
        fields:
          - {label: "Dokumento pavadinimas", name: "title", widget: "string"}
          - {label: "PDF failas", name: "url", widget: "file"}
      - {label: "Techninės specifikacijos", name: "specs", widget: "markdown"}
      - {label: "Paskirtis ir taikymo sritys", name: "application", widget: "markdown"}
      - {label: "Administratoriaus el. paštas", name: "manager_email", widget: "string", default: "info@kartonoprojektai.lt"}
