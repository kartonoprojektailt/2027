<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartono Projektai - Valdymo pultas</title>
<style>
  :root { --bg: #f4f6f8; --card: #ffffff; --primary: #2b6cb0; --primary-hover: #234e70; --text: #2d3748; --border: #cbd5e0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
  .container { max-width: 850px; margin: 0 auto; }
  .card { background: var(--card); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
  h1, h2 { margin-top: 0; font-size: 1.5rem; color: #1a202c; }
  label { display: block; margin-top: 14px; font-weight: 600; font-size: 0.9rem; }
  input, select, textarea { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
  textarea { min-height: 120px; resize: vertical; }
  button { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 20px; width: 100%; font-weight: bold; }
  button:hover { background: var(--primary-hover); }
  .login-box { max-width: 400px; margin: 80px auto; text-align: center; }
  .hidden { display: none !important; }
  .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #e2e8f0; }
  .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
  .badge.active { background: #c6f6d5; color: #22543d; }
  .badge.parduota { background: #fed7d7; color: #742a2a; }
  .badge.sale { background: #feebc8; color: #9c4221; }
  .btn-sm { padding: 6px 12px; font-size: 0.85rem; width: auto; margin: 0 4px; }
  .btn-danger { background: #e53e3e; }
  .btn-danger:hover { background: #c53030; }
  .btn-success { background: #38a169; }
  .btn-success:hover { background: #2f855a; }
  .flex { display: flex; gap: 10px; }
  .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 16px; background: #fffaf0; padding: 12px; border-radius: 6px; border: 1px solid #fbd38d; }
  .checkbox-group input { width: auto; margin-top: 0; }
</style>
</head>
<body>

<div class="container">
  <!-- EKRAN LOGOWANIA -->
  <div id="loginScreen" class="card login-box">
    <h2>Valdymo Pultas</h2>
    <p style="font-size: 0.9rem; color: #666;">Įveskite administratoriaus slaptažodį</p>
    <input type="password" id="passInput" placeholder="Slaptažodis...">
    <button onclick="tryLogin()">Prisijungti</button>
    <p id="loginError" style="color: #e53e3e; font-size: 0.85rem; margin-top: 10px; display: none;">Neteisingas slaptažodis!</p>
  </div>

  <!-- PANEL ZARZĄDZANIA -->
  <div id="adminScreen" class="hidden">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Sandėlio Valdymas (Išpardavimas)</h1>
        <button onclick="logout()" class="btn-sm btn-danger" style="margin-top: 0;">Atsijungti</button>
      </div>
      <p style="font-size: 0.9rem; color: #666;">Sukurkite prekę, įkelkite media failus ir parsisiųskite `.md` failą.</p>
    </div>

    <!-- FORMULARZ TWORZENIA / EDYCJI -->
    <div class="card">
      <h2 id="formTitle">Sukurti naują pasiūlymą</h2>
      
      <label>Pavadinimas (Title)
        <input type="text" id="title" placeholder="pvz. Baltas kartoninis stovas A2">
      </label>

      <div class="flex">
        <div style="flex: 1;">
          <label>Unikalus kodas (SKU)
            <input type="text" id="offer_code" placeholder="pvz. KP-ST-A2">
          </label>
        </div>
        <div style="flex: 1;">
          <label>Būklė (Condition)
            <select id="condition">
              <option value="NewCondition">Naujas (New)</option>
              <option value="UsedCondition">Naudotas (Used)</option>
              <option value="RefurbishedCondition">Atnaujintas</option>
            </select>
          </label>
        </div>
      </div>

      <div class="flex">
        <div style="flex: 1;">
          <label>Kategorija
            <select id="category">
              <option value="Stovai">Stovai</option>
              <option value="Pakuotės">Pakuotės</option>
              <option value="Medžiagos">Medžiagos</option>
              <option value="Paslaugos">Paslaugos</option>
            </select>
          </label>
        </div>
        <div style="flex: 1;">
          <label>Statusas
            <select id="status">
              <option value="active">Galioja</option>
              <option value="parduota">Parduota</option>
            </select>
          </label>
        </div>
      </div>

      <!-- SEKCJA CEN I WYPRZEDAŻY (SCHEMA.ORG CLEARANCE) -->
      <div class="flex">
        <div style="flex: 1;">
          <label>Akcijonė / Dabartinė Kaina (EUR)
            <input type="number" step="0.01" id="price" placeholder="10.00">
          </label>
        </div>
        <div style="flex: 1;">
          <label>Sena / Pradinė Kaina (jei wyprzedaż, np. 15.00)
            <input type="number" step="0.01" id="original_price" placeholder="15.00">
          </label>
        </div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="is_sale" checked>
        <label for="is_sale" style="margin-top: 0; cursor: pointer;">
          <strong>Išpardavimas / Akcija (Clearance / Special Sale)</strong><br>
          <small style="color: #666;">Žymi prekę kaip ypatingą sandėlio pasiūlymą (Schema.org SalePrice)</small>
        </label>
      </div>

      <div class="flex">
        <div style="flex: 1;">
          <label>Likutis (vnt.)
            <input type="number" id="stock" placeholder="5">
          </label>
        </div>
        <div style="flex: 1;">
          <label>Matmenys (Dimensions)
            <input type="text" id="dimensions" placeholder="600x420x10 mm">
          </label>
        </div>
      </div>

      <!-- MEDIA, FOTO, CAD, PDF, VIDEO -->
      <label>Nuotraukos / GIF failų pavadinimai (atskirti kableliais)
        <input type="text" id="images" placeholder="stovas-a2.jpg, stovas-detal.gif">
      </label>

      <label>Dokumentai / CAD brėžiniai / PDF / Video failai (atskirti kableliais)
        <input type="text" id="documents" placeholder="brezinys.pdf, instrukcija.dwg, preke.mp4">
      </label>

      <label>Aprašymas
        <textarea id="description" placeholder="Detalus prekės aprašymas, paskirtis..."></textarea>
      </label>

      <button onclick="generateMarkdownFile()" class="btn-success">Generuoti ir parsisiųsti Hugo `.md` failą</button>
    </div>

    <!-- LISTA LOKALNA -->
    <div class="card">
      <h2>Išsaugoti lokaliai naršyklėje</h2>
      <div id="itemsList"></div>
    </div>
  </div>
</div>

<script>
  const ADMIN_PASS = "kartonas2027";
  let items = JSON.parse(localStorage.getItem('kp_warehouse_v4') || '[]');

  function tryLogin() {
    const p = document.getElementById('passInput').value;
    if(p === ADMIN_PASS) {
      localStorage.setItem('kp_logged', 'true');
      showAdmin();
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  }

  function logout() {
    localStorage.removeItem('kp_logged');
    location.reload();
  }

  function showAdmin() {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('adminScreen').classList.remove('hidden');
    renderList();
  }

  if(localStorage.getItem('kp_logged') === 'true') {
    showAdmin();
  }

  function slugify(text) {
    return text.toString().toLowerCase()
      .trim()
      .replace(/\s+/g, '-')
      .replace(/[^\w\-]+/g, '')
      .replace(/\-\-+/g, '-');
  }

  function generateMarkdownFile() {
    const title = document.getElementById('title').value;
    if(!title) { alert('Įveskite pavadinimą!'); return; }

    const offer_code = document.getElementById('offer_code').value;
    const condition = document.getElementById('condition').value;
    const category = document.getElementById('category').value;
    const status = document.getElementById('status').value;
    const price = document.getElementById('price').value || 0;
    const original_price = document.getElementById('original_price').value;
    const is_sale = document.getElementById('is_sale').checked;
    const stock = document.getElementById('stock').value || 0;
    const dimensions = document.getElementById('dimensions').value;
    const imagesStr = document.getElementById('images').value;
    const docsStr = document.getElementById('documents').value;
    const description = document.getElementById('description').value;

    const slug = slugify(title);

    // Przetwarzanie plików na tablice w YAML
    const imagesList = imagesStr ? imagesStr.split(',').map(s => s.trim()).filter(Boolean) : [];
    const docsList = docsStr ? docsStr.split(',').map(s => s.trim()).filter(Boolean) : [];

    // Format Hugo Frontmatter z pełnym Schema.org dla Išpardavimas / Sale
    let mdContent = `---
title: "${title}"
`;
    if(offer_code) mdContent += `offer_code: "${offer_code}"\n`;
    mdContent += `category: "${category}"
status: "${status}"
price: ${price}
`;
    if(original_price) mdContent += `original_price: ${original_price}\n`;
    mdContent += `currency: "EUR"
is_sale: ${is_sale}
stock: ${stock}
condition: "${condition}"
`;
    if(dimensions) mdContent += `dimensions: "${dimensions}"\n`;
    
    if(imagesList.length > 0) {
      mdContent += `images:\n`;
      imagesList.forEach(img => mdContent += `  - "${img}"\n`);
      mdContent += `image: "${imagesList[0]}"\n`; // główna dla kompatybilności
    }

    if(docsList.length > 0) {
      mdContent += `documents:\n`;
      docsList.forEach(doc => mdContent += `  - "${doc}"\n`);
    }

    mdContent += `date: ${new Date().toISOString().split('T')[0]}
---

${description}
`;

    const item = { title, category, status, price, is_sale, slug };
    items.push(item);
    localStorage.setItem('kp_warehouse_v4', JSON.stringify(items));
    renderList();

    const blob = new Blob([mdContent], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${slug}.md`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    alert(`Failas "${slug}.md" sugeneruotas su išpardavimo ir media duomenimis!`);
    clearForm();
  }

  function clearForm() {
    document.getElementById('title').value = '';
    document.getElementById('offer_code').value = '';
    document.getElementById('price').value = '';
    document.getElementById('original_price').value = '';
    document.getElementById('stock').value = '';
    document.getElementById('dimensions').value = '';
    document.getElementById('images').value = '';
    document.getElementById('documents').value = '';
    document.getElementById('description').value = '';
  }

  function renderList() {
    const listDiv = document.getElementById('itemsList');
    if(items.length === 0) {
      listDiv.innerHTML = '<p style="color: #666; font-size: 0.9rem;">Lokalių įrašų nėra.</p>';
      return;
    }
    
    let html = '';
    items.forEach((item, index) => {
      let badgeClass = item.status === 'parduota' ? 'parduota' : 'active';
      let badgeText = item.status === 'parduota' ? 'Parduota' : 'Galioja';
      if(item.is_sale && item.status !== 'parduota') {
        badgeClass = 'sale';
        badgeText = 'Išpardavimas';
      }

      html += `
        <div class="item-row">
          <div>
            <strong>${item.title}</strong> (${item.category})<br>
            <small style="color: #666;">Kaina: ${item.price} EUR</small>
          </div>
          <div>
            <span class="badge ${badgeClass}">${badgeText}</span>
            <button onclick="deleteItem(${index})" class="btn-sm btn-danger">Šalinti</button>
          </div>
        </div>
      `;
    });
    listDiv.innerHTML = html;
  }

  function deleteItem(index) {
    if(confirm('Ar tikrai norite pašalinti?')) {
      items.splice(index, 1);
      localStorage.setItem('kp_warehouse_v4', JSON.stringify(items));
      renderList();
    }
  }
</script>
</body>
</html>
