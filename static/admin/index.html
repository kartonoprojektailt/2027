<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartono Projektai - Valdymo pultas</title>
<style>
  :root { --bg: #f4f6f8; --card: #ffffff; --primary: #2b6cb0; --primary-hover: #234e70; --text: #2d3748; --border: #cbd5e0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
  .container { max-width: 950px; margin: 0 auto; }
  .card { background: var(--card); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
  h1, h2, h3 { margin-top: 0; font-size: 1.5rem; color: #1a202c; }
  label { display: block; margin-top: 14px; font-weight: 600; font-size: 0.9rem; }
  input, select, textarea { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
  textarea { min-height: 120px; resize: vertical; }
  button { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 20px; width: 100%; font-weight: bold; }
  button:hover { background: var(--primary-hover); }
  .hidden { display: none !important; }
  .flex { display: flex; gap: 10px; }
  .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 16px; background: #fffaf0; padding: 12px; border-radius: 6px; border: 1px solid #fbd38d; }
  .checkbox-group input { width: auto; margin-top: 0; }
  .file-info { font-size: 0.85rem; color: #666; margin-top: 4px; }
  .settings-box { background: #edf2f7; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
  .btn-sm { padding: 6px 12px; font-size: 0.85rem; width: auto; margin: 0; }
  .btn-danger { background: #e53e3e; }
  .btn-success { background: #38a169; }
  .btn-warning { background: #d69e2e; }
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  th { background: #f7fafc; }
  .actions-cell { display: flex; gap: 6px; }
</style>
</head>
<body>

<div class="container">
  <!-- PANEL ZARZĄDZANIA -->
  <div id="adminScreen">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Sandėlio Valdymas</h1>
      </div>
      <p style="font-size: 0.9rem; color: #666;">Valdykite esamus skelbimus arba kurkite naujus.</p>
    </div>

    <!-- KONFIGURACJA GITHUB API -->
    <div class="card settings-box">
      <h3>GitHub Nustatymai</h3>
      <div class="flex">
        <div style="flex: 1;">
          <label>Repozitorija (`vardas/repo`)
            <input type="text" id="ghRepo" placeholder="vardas/pavadinimas">
          </label>
        </div>
        <div style="flex: 1;">
          <label>GitHub Token
            <input type="password" id="ghToken" placeholder="ghp_...">
          </label>
        </div>
      </div>
      <button onclick="saveSettings(); loadOffers();" class="btn-sm" style="margin-top: 10px; background: #4a5568;">Išsaugoti nustatymus ir užkrauti skelbimus</button>
    </div>

    <!-- LISTA ISTNIEJĄCYCH OGŁOSZEŃ -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Esami skelbimai sandėlyje</h2>
        <button onclick="loadOffers()" class="btn-sm" style="width: auto; margin:0;">🔄 Atnaujinti sąrašą</button>
      </div>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Katalogo pavadinimas (Slug)</th>
              <th>Veiksmai</th>
            </tr>
          </thead>
          <tbody id="offersTableBody">
            <tr><td colspan="2" style="text-align:center; color:#666;">Spauskite „Atnaujinti sąrašą“ arba įveskite nustatymus.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- FORMULARZ TWORZENIA / EDYCJI -->
    <div class="card">
      <h2 id="formTitle">Sukurti naują pasiūlymą</h2>
      <input type="hidden" id="editSlug" value="">
      
      <label>Pavadinimas (Title)
        <input type="text" id="title" placeholder="pvz. Baltas kartoninis stovas A2">
      </label>

      <div class="flex">
        <div style="flex: 1;">
          <label>Unikalus kodas (SKU)
            <input type="text" id="offer_code" placeholder="pvz. KP-ST-A2">
          </label>
        </div>
        <div style="flex: 1;">
          <label>Būklė (Condition)
            <select id="condition">
              <option value="NewCondition">Naujas (New)</option>
              <option value="UsedCondition">Naudotas (Used)</option>
              <option value="RefurbishedCondition">Atnaujintas</option>
            </select>
          </label>
        </div>
      </div>

      <div class="flex">
        <div style="flex: 1;">
          <label>Kategorija
            <select id="category">
              <option value="Stovai">Stovai</option>
              <option value="Pakuotės">Pakuotės</option>
              <option value="Medžiagos">Medžiagos</option>
              <option value="Paslaugos">Paslaugos</option>
            </select>
          </label>
        </div>
        <div style="flex: 1;">
          <label>Statusas
            <select id="status">
              <option value="active">Galioja</option>
              <option value="parduota">Parduota (Sold)</option>
            </select>
          </label>
        </div>
      </div>

      <div class="flex">
        <div style="flex: 1;">
          <label>Akcijinė / Dabartinė Kaina (EUR)
            <input type="number" step="0.01" id="price" placeholder="10.00">
          </label>
        </div>
        <div style="flex: 1;">
          <label>Sena / Pradinė Kaina
            <input type="number" step="0.01" id="original_price" placeholder="15.00">
          </label>
        </div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="is_sale" checked>
        <label for="is_sale" style="margin-top: 0; cursor: pointer;">
          <strong>Išpardavimas / Akcija</strong>
        </label>
      </div>

      <div class="flex">
        <div style="flex: 1;">
          <label>Likutis (vnt.)
            <input type="number" id="stock" placeholder="5">
          </label>
        </div>
        <div style="flex: 1;">
          <label>Matmenys (Dimensions)
            <input type="text" id="dimensions" placeholder="600x420x10 mm">
          </label>
        </div>
      </div>

      <label>Nuotraukos / GIF (pasirinkite naujas)
        <input type="file" id="imagesInput" multiple accept="image/*,.gif">
        <div class="file-info" id="imgInfo">Pasirinkta nuotraukų: 0</div>
      </label>

      <label>Dokumentai / CAD / PDF
        <input type="file" id="docsInput" multiple accept=".pdf,.dwg,.dxf,.step,.stp,.zip">
        <div class="file-info" id="docInfo">Pasirinkta dokumentų: 0</div>
      </label>

      <label>Aprašymas
        <textarea id="description" placeholder="Detalus prekės aprašymas..."></textarea>
      </label>

      <button onclick="publishToGitHub()" class="btn-success" id="pubBtn">🚀 Paskelbti / Išsaugoti pakeitimus</button>
      <button onclick="resetForm()" class="btn-danger hidden" id="cancelBtn" style="margin-top: 10px;">Atšaukti redagavimą</button>
    </div>
  </div>
</div>

<script>
  window.onload = function() {
    loadSettings();
    loadOffers();
  };

  function saveSettings() {
    localStorage.setItem('kp_repo', document.getElementById('ghRepo').value);
    localStorage.setItem('kp_token', document.getElementById('ghToken').value);
    alert('Nustatymai išsaugoti!');
  }

  function loadSettings() {
    document.getElementById('ghRepo').value = localStorage.getItem('kp_repo') || '';
    document.getElementById('ghToken').value = localStorage.getItem('kp_token') || '';
  }

  document.getElementById('imagesInput').addEventListener('change', function() {
    document.getElementById('imgInfo').textContent = `Pasirinkta nuotraukų: ${this.files.length}`;
  });

  document.getElementById('docsInput').addEventListener('change', function() {
    document.getElementById('docInfo').textContent = `Pasirinkta dokumentų: ${this.files.length}`;
  });

  function slugify(text) {
    return text.toString().toLowerCase()
      .trim()
      .replace(/\s+/g, '-')
      .replace(/[^\w\-]+/g, '')
      .replace(/\-\-+/g, '-');
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => {
        let encoded = reader.result.toString().replace(/^data:(.*,)?/, '');
        if ((encoded.length % 4) > 0) {
          encoded += '='.repeat(4 - (encoded.length % 4));
        }
        resolve(encoded);
      };
      reader.onerror = error => reject(error);
    });
  }

  async function uploadFileToGitHub(file, path, repo, token) {
    const content = await fileToBase64(file);
    const url = `https://api.github.com/repos/${repo}/contents/${path}`;
    
    let sha = null;
    const existing = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
    if (existing.ok) {
      const data = await existing.json();
      sha = data.sha;
    }

    const bodyData = {
      message: `Admin update/upload: ${path}`,
      content: content
    };
    if (sha) bodyData.sha = sha;

    const response = await fetch(url, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(bodyData)
    });
    if (!response.ok) throw new Error(`Klaida įkeliant failą ${path}`);
  }

  async function loadOffers() {
    const repo = localStorage.getItem('kp_repo');
    const token = localStorage.getItem('kp_token');
    const tbody = document.getElementById('offersTableBody');
    if(!repo || !token) {
      tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#e53e3e;">Įveskite GitHub nustatymus viršuje!</td></tr>`;
      return;
    }

    tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#666;">Kraunasi skelbimai...</td></tr>`;

    try {
      const url = `https://api.github.com/repos/${repo}/contents/content/sandelyje`;
      const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
      if(!res.ok) throw new Error('Nepavyko gauti sandėlio turinio.');
      const items = await res.json();

      tbody.innerHTML = '';
      const folders = items.filter(item => item.type === 'dir');

      if(folders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#666;">Sandėlyje nėra jokių skelbimų.</td></tr>`;
        return;
      }

      folders.forEach(folder => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${folder.name}</strong></td>
          <td class="actions-cell">
            <button class="btn-sm btn-warning" onclick="quickMarkSold('${folder.name}')">Parduota</button>
            <button class="btn-sm" onclick="editOffer('${folder.name}')">Redaguoti</button>
            <button class="btn-sm btn-danger" onclick="deleteOffer('${folder.name}')">Trinti</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    } catch(err) {
      tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#e53e3e;">Klaida: ${err.message}</td></tr>`;
    }
  }

  async function quickMarkSold(slug) {
    const repo = localStorage.getItem('kp_repo');
    const token = localStorage.getItem('kp_token');
    if(!confirm(`Ar tikrai norite pažymėti skelbimą „${slug}“ kaip Parduotą (Sold)?`)) return;

    try {
      const url = `https://api.github.com/repos/${repo}/contents/content/sandelyje/${slug}/index.md`;
      const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
      if(!res.ok) throw new Error('Nepavyko perskaityti index.md');
      const fileData = await res.json();
      const content = decodeURIComponent(escape(atob(fileData.content)));

      let updatedContent = content;
      if (updatedContent.includes('status:')) {
        updatedContent = updatedContent.replace(/status:\s*"?[a-zA-Z]+"?[ \t]*/, 'status: "parduota"\n');
      } else {
        updatedContent = updatedContent.replace('---', '---\nstatus: "parduota"');
      }

      const encodedContent = btoa(unescape(encodeURIComponent(updatedContent)));
      const updateRes = await fetch(url, {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: `Quick mark sold: ${slug}`, content: encodedContent, sha: fileData.sha })
      });

      if(!updateRes.ok) throw new Error('Nepavyko atnaujinti failo.');
      alert('🎉 Skelbimas sėkmingai pažymėtas kaip parduotas!');
      loadOffers();
    } catch(err) {
      alert('Klaida: ' + err.message);
    }
  }

  async function deleteOffer(slug) {
    const repo = localStorage.getItem('kp_repo');
    const token = localStorage.getItem('kp_token');
    if(!confirm(`⚠️ Ar tikrai norite VISAM LAIKUI ištrinti skelbimą „${slug}“ (kartu su visais failais)?`)) return;

    try {
      const url = `https://api.github.com/repos/${repo}/contents/content/sandelyje/${slug}`;
      const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
      if(!res.ok) throw new Error('Nepavyko rasti aplanko.');
      const files = await res.json();

      for(let file of files) {
        await fetch(`https://api.github.com/repos/${repo}/contents/${file.path}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: `Delete asset: ${file.path}`, sha: file.sha })
        });
      }

      alert('🗑️ Skelbimas sėkmingai pašalintas!');
      loadOffers();
    } catch(err) {
      alert('Klaida trinant: ' + err.message);
    }
  }

  async function editOffer(slug) {
    const repo = localStorage.getItem('kp_repo');
    const token = localStorage.getItem('kp_token');
    try {
      const url = `https://api.github.com/repos/${repo}/contents/content/sandelyje/${slug}/index.md`;
      const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
      if(!res.ok) throw new Error('Nepavyko rasti index.md failo.');
      const fileData = await res.json();
      const text = decodeURIComponent(escape(atob(fileData.content)));

      document.getElementById('editSlug').value = slug;
      document.getElementById('formTitle').textContent = `Redaguoti skelbimą: ${slug}`;
      document.getElementById('cancelBtn').classList.remove('hidden');

      const titleMatch = text.match(/title:\s*"([^"]+)"/);
      if(titleMatch) document.getElementById('title').value = titleMatch[1];

      const codeMatch = text.match(/offer_code:\s*"([^"]+)"/);
      if(codeMatch) document.getElementById('offer_code').value = codeMatch[1];

      const catMatch = text.match(/category:\s*"([^"]+)"/);
      if(catMatch) document.getElementById('category').value = catMatch[1];

      const statusMatch = text.match(/status:\s*"([^"]+)"/);
      if(statusMatch) document.getElementById('status').value = statusMatch[1];

      const priceMatch = text.match(/price:\s*([0-9.]+)/);
      if(priceMatch) document.getElementById('price').value = priceMatch[1];

      const origMatch = text.match(/original_price:\s*([0-9.]+)/);
      if(origMatch) document.getElementById('original_price').value = origMatch[1];

      const stockMatch = text.match(/stock:\s*([0-9]+)/);
      if(stockMatch) document.getElementById('stock').value = stockMatch[1];

      const dimMatch = text.match(/dimensions:\s*"([^"]+)"/);
      if(dimMatch) document.getElementById('dimensions').value = dimMatch[1];

      const parts = text.split(/---\s*\n/);
      if(parts.length >= 3) {
        document.getElementById('description').value = parts.slice(2).join('---').trim();
      }

      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    } catch(err) {
      alert('Klaida kraunant duomenis redagavimui: ' + err.message);
    }
  }

  function resetForm() {
    document.getElementById('editSlug').value = '';
    document.getElementById('formTitle').textContent = 'Sukurti naują pasiūlymą';
    document.getElementById('cancelBtn').classList.add('hidden');
    clearForm();
  }

  async function publishToGitHub() {
    const repo = localStorage.getItem('kp_repo');
    const token = localStorage.getItem('kp_token');
    if(!repo || !token) {
      alert('Prašome pirma įvesti ir išsaugoti GitHub nustatymus!');
      return;
    }

    const title = document.getElementById('title').value;
    if(!title) { alert('Įveskite pavadinimą!'); return; }

    const editSlug = document.getElementById('editSlug').value;
    const slug = editSlug ? editSlug : slugify(title);

    const btn = document.getElementById('pubBtn');
    btn.disabled = true;
    btn.textContent = '⏳ Saugoma ir siunčiama...';

    try {
      const imgFiles = document.getElementById('imagesInput').files;
      const docFiles = document.getElementById('docsInput').files;
      let imagesList = [];
      let docsList = [];

      // Įkeliame nuotraukas
      for(let file of imgFiles) {
        await uploadFileToGitHub(file, `content/sandelyje/${slug}/${file.name}`, repo, token);
        imagesList.push(file.name);
      }

      // Įkeliame dokumentus (PDF / CAD / kt.)
      for(let file of docFiles) {
        await uploadFileToGitHub(file, `content/sandelyje/${slug}/${file.name}`, repo, token);
        docsList.push(file.name);
      }

      const offer_code = document.getElementById('offer_code').value;
      const condition = document.getElementById('condition').value;
      const category = document.getElementById('category').value;
      const status = document.getElementById('status').value;
      const price = document.getElementById('price').value || 0;
      const original_price = document.getElementById('original_price').value;
      const is_sale = document.getElementById('is_sale').checked;
      const stock = document.getElementById('stock').value || 0;
      const dimensions = document.getElementById('dimensions').value;
      const description = document.getElementById('description').value;

      let mdContent = `---
title: "${title}"
`;
      if(offer_code) mdContent += `offer_code: "${offer_code}"\n`;
      mdContent += `category: "${category}"
status: "${status}"
price: ${price}
`;
      if(original_price) mdContent += `original_price: ${original_price}\n`;
      mdContent += `currency: "EUR"
is_sale: ${is_sale}
stock: ${stock}
condition: "${condition}"
`;
      if(dimensions) mdContent += `dimensions: "${dimensions}"\n`;
      
      if(imagesList.length > 0) {
        mdContent += `images:\n`;
        imagesList.forEach(img => mdContent += `  - "${img}"\n`);
        mdContent += `image: "${imagesList[0]}"\n`;
      }

      // Įrašome dokumentus į Frontmatter, kad Hugo šablonas galėtų juos atvaizduoti
      if(docsList.length > 0) {
        mdContent += `documents:\n`;
        docsList.forEach(doc => mdContent += `  - "${doc}"\n`);
      }

      mdContent += `date: ${new Date().toISOString().split('T')[0]}
---

${description}
`;

      const mdFile = new File([mdContent], `index.md`, { type: 'text/markdown' });
      await uploadFileToGitHub(mdFile, `content/sandelyje/${slug}/index.md`, repo, token);

      alert('🎉 Skelbimas ir visi failai (nuotraukos bei PDF) sėkmingai išsaugoti!');
      resetForm();
      loadOffers();
    } catch(err) {
      alert('Klaida publikuojant: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '🚀 Paskelbti / Išsaugoti pakeitimus';
    }
  }

  function clearForm() {
    document.getElementById('title').value = '';
    document.getElementById('offer_code').value = '';
    document.getElementById('price').value = '';
    document.getElementById('original_price').value = '';
    document.getElementById('stock').value = '';
    document.getElementById('dimensions').value = '';
    document.getElementById('imagesInput').value = '';
    document.getElementById('docsInput').value = '';
    document.getElementById('imgInfo').textContent = 'Pasirinkta nuotraukų: 0';
    document.getElementById('docInfo').textContent = 'Pasirinkta dokumentų: 0';
    document.getElementById('description').value = '';
  }
</script>
</body>
</html>
