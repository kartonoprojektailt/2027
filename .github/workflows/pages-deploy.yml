name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  # Opcjonalnie: automatyczne odpytanie arkusza raz dziennie lub możesz to usunąć, jeśli wolisz tylko przy zmianach
  schedule:
    - cron: '0 */6 * * *' # Sprawdza co 6 godzin (możesz zmienić lub usunąć)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread oauth2client pandas

      - name: Run Google Sheets to Hugo Sync
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python master_sheet_to_hugo.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.9'
          extended: true

      - name: Build Hugo
        run: hugo --minify
