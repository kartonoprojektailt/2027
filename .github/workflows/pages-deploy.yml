name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  # Automatyczne odpytanie arkusza co 6 godzin
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread oauth2client pandas google-auth Pillow

      - name: Run Google Sheets to Hugo Sync
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python master_sheet_to_hugo.py

      - name: Commit and push generated markdown files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ static/images/ data/
          git commit -m "Auto-update content and search matrix from Google Sheets [skip ci]" || exit 0
          git push

      - name: Install Hugo via apt
        run: |
          sudo apt-get update
          sudo apt-get install -y hugo

      - name: Build Hugo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: hugo --minify
