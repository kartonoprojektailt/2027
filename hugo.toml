baseURL = "/"
locale = "lt"
title = "Kartono projektai"
theme = "PaperMod"

[permalinks]
  page = "/:slug/"
  section = "/:slug/"

# ==========================================
# WŁĄCZENIE HTML W MARKDOWN (GOLDMARK)
# ==========================================
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# ==========================================
# PARAMETRY GŁÓWNE I MOTYWU PAPERMOD
# ==========================================
[params]
  env = "production"
  title = "Kartono projektai"
  description = "Reklaminių stendų ir pakuočių gamintojas UAB Kartono projektai"
  defaultTheme = "light"
  disableThemeToggle = false

  # Autor i metadane
  author = "UAB Kartono projektai"
  showAuthor = false
  hideMeta = true
  showShareButtons = false
  showReadingTime = false
  disableScrollToTop = false

  [params.label]
    text = "Kartono projektai"
    icon = ""
    iconHeight = 35

  # Konfiguracja wyszukiwarki Fuse.js dla PaperMod
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 100
    threshold = 0.3
    minMatchCharLength = 2
    keys = ["title", "permalink", "summary", "content", "search_cloud", "offer_code", "category"]

# ==========================================
# WYTWARZANIE PLIKÓW WYJŚCIOWYCH (WYMAGANE DLA WYSZUKIWARKI)
# ==========================================
[outputs]
  home = ["HTML", "RSS", "JSON", "llms"]
  page = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

