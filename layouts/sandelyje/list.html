{{ define "main" }}
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
  </header>

  <div class="post-content">
    
    <!-- SIATKA PRODUKTÓW Z ZAKŁADKI SANDELYJE -->
    <div class="inventory-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px;">
      {{ range (where site.RegularPages "Section" "sandelyje") }}
      <div class="item-card" onclick="location.href='{{ .Permalink }}';" style="border: 1px solid var(--border); padding: 20px; border-radius: 8px; background: var(--entry); display: flex; flex-direction: column; justify-content: space-between; cursor: pointer;">
        <div>
          <h2 style="font-size: 1.1rem; margin-bottom: 8px; margin-top: 0;">
            <a href="{{ .Permalink }}" style="color: var(--primary); text-decoration: none;">{{ .Title }}</a>
          </h2>
          
          {{ if .Params.category }}
          <p style="font-size: 0.85rem; margin-bottom: 8px;">Kategorija: <strong>{{ .Params.category }}</strong></p>
          {{ end }}

          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.95rem;">
            <span style="font-size: 1.2rem; font-weight: bold; color: var(--primary);">{{ .Params.price }} €</span>
            <span style="font-size: 0.85rem;">Likutis: <strong>{{ .Params.stock }} vnt.</strong></span>
          </div>
        </div>
        
        <div style="margin-top: 15px;">
          <a href="{{ .Permalink }}" style="display: block; background: var(--tertiary); color: var(--primary); padding: 10px; text-align: center; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 0.9rem; border: 1px solid var(--border);">
            Peržiūrėti pasiūlymą
          </a>
        </div>
      </div>
      {{ end }}
    </div>

    <!-- TEKST OPISOWY SEKCJI Z PŁASZCZYZNY _index.md -->
    <div class="section-description-text" style="border-top: 1px solid var(--border); padding-top: 30px;">
      {{ .Content }}
    </div>

  </div>
</article>
{{ end }}
