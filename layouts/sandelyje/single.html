{{ define "main" }}
<!-- Schema.org Structured Data for AI & Google Search -->
<script type="application/ld+json">
{
  "@context": "https://schema.org/",
  "@type": "Product",
  "name": "{{ .Title }}",
  "image": [
    {{ $schemaImgs := .Resources.ByType "image" }}
    {{ if not $schemaImgs }}{{$schemaImgs = .Resources.Match "images/*" }}{{ end }}
    {{ if not $schemaImgs }}{{$schemaImgs = .Params.images }}{{ end }}
    {{ range $index, $element :=$schemaImgs }}
      {{ $imgLink := "" }}
      {{ if reflect.IsMap . }}{$imgLink = .Permalink}
      {{ else }}{$imgLink = printf "%s" . | absURL}{{ end }}
      {{ if gt $index 0 }},{{ end }}"{{ $imgLink }}"
    {{ end }}
  ],
  "description": "{{ .Description }}",
  "sku": "{{ .Params.offer_code }}",
  "offers": {
    "@type": "Offer",
    "priceCurrency": "EUR",
    "price": "{{ .Params.price }}",
    "availability": "{{ if or (eq .Params.status "parduota") (eq .Params.status "sold_out") }}https://schema.org/SoldOut{{ else }}https://schema.org/InStock{{ end }}",
    "seller": {
      "@type": "Organization",
      "name": "UAB „Kartono projektai“"
    }
  }
}
</script>

<article class="post-single" itemscope itemtype="https://schema.org/Product">
    <header class="post-header">
        <div style="margin-bottom: 15px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; font-size: 0.9rem;">
            {{ if .Params.offer_code }}
            <span style="background: var(--code-bg, #eee); padding: 4px 10px; border-radius: 4px; font-family: monospace;">Kod: {{ .Params.offer_code }}</span>
            {{ end }}
        </div>
        <h1 class="post-title" itemprop="name">
            {{ .Title }}
        </h1>
    </header>

    <div class="post-content" itemprop="description">
        {{ .Content }}
    </div>
</article>
{{ end }}
